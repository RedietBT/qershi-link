apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-auth-service
  namespace: sacco-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-auth
  template:
    metadata:
      labels:
        app: identity-auth
    spec:
      containers:
        - name: identity-auth
          image: identity-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/qershi-link"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: JWT_SECRET
              value: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
---
apiVersion: v1
kind: Service
metadata:
  name: identity-auth-service
  namespace: sacco-core
spec:
  type: LoadBalancer
  selector:
    app: identity-auth
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080