apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-auth-service
  namespace: sacco-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-auth
  template:
    metadata:
      labels:
        app: identity-auth
    spec:
      containers:
        - name: identity-auth
          image: identity-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/qershi-link"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: JWT_SECRET
              value: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-service"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: GRPC_CLIENT_NOTIFICATION_SERVICE_ADDRESS
              value: "static://notification-service:9086"
            - name: AFROMESSAGE_API_KEY
              value: "eyJhbGciOiJIUzI1NiJ9.eyJpZGVudGlmaWVyIjoiMmZIMjdweTJZampWMWlYNVJxMHhFeGZaZnNjd1UxM2QiLCJleHAiOjE5NDQyNDM4MzQsImlhdCI6MTc4NjQ3NzQzNCwianRpIjoiOTM5Y2MxM2EtNjQ1My00NjBlLWFhMDQtMmViZTVjY2M0ZjZlIn0.JToav9-Hvhg5VjUdFeNtBdceG-UYX0Sx7W1-7ugQTXo"
            - name: AFROMESSAGE_API_URL
              value: "https://api.afromessage.com/api/send"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: identity-auth-service
  namespace: sacco-core
spec:
  type: LoadBalancer
  selector:
    app: identity-auth
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080