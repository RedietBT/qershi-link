apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-auth-service
  namespace: sacco-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-auth
  template:
    metadata:
      labels:
        app: identity-auth
    spec:
      containers:
        - name: identity-auth
          image: identity-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/qershi-link"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sacco-secrets
                  key: JWT_SECRET
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-service"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: GRPC_CLIENT_NOTIFICATION_SERVICE_ADDRESS
              value: "static://notification-service:9086"
            - name: AFROMESSAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sacco-secrets
                  key: AFROMESSAGE_API_KEY
            - name: AFROMESSAGE_API_URL
              valueFrom:
                secretKeyRef:
                  name: sacco-secrets
                  key: AFROMESSAGE_API_URL
            - name: SPRING_FLYWAY_DEFAULT_SCHEMA
              value: "master_schema"
            - name: SPRING_FLYWAY_SCHEMAS
              value: "master_schema"
            - name: SPRING_FLYWAY_CREATE_SCHEMAS
              value: "true"
            - name: SPRING_FLYWAY_TABLE
              value: "flyway_schema_history_identity"
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: identity-auth-service
  namespace: sacco-core
spec:
  type: LoadBalancer
  selector:
    app: identity-auth
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080