apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-origination-service
  namespace: sacco-core
  labels:
    app: loan-origination-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-origination-service
  template:
    metadata:
      labels:
        app: loan-origination-service
    spec:
      containers:
        - name: loan-origination-service
          image: loan-origination-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
              name: http
            - containerPort: 9084
              name: grpc
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/qershi-link?stringtype=unspecified"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: GRPC_CLIENT_NOTIFICATION_SERVICE_ADDRESS
              value: "static://notification-service:9086"
            - name: JWT_SECRET
              value: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 90
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 150
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: loan-origination-service
  namespace: sacco-core
spec:
  selector:
    app: loan-origination-service
  ports:
    - port: 8084
      targetPort: 8084
      name: http
    - port: 9084
      targetPort: 9084
      name: grpc
  type: ClusterIP
