apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: sacco-core
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
            - name: grpc
              containerPort: 9086
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/qershi-link?stringtype=unspecified"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: SERVER_PORT
              value: "8086"
            - name: GRPC_SERVER_PORT
              value: "9086"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sacco-secrets
                  key: JWT_SECRET
            - name: AFROMESSAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sacco-secrets
                  key: AFROMESSAGE_API_KEY
            - name: AFROMESSAGE_API_URL
              valueFrom:
                secretKeyRef:
                  name: sacco-secrets
                  key: AFROMESSAGE_API_URL
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-service"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_FLYWAY_DEFAULT_SCHEMA
              value: "master_schema"
            - name: SPRING_FLYWAY_SCHEMAS
              value: "master_schema"
            - name: SPRING_FLYWAY_TABLE
              value: "flyway_schema_history_notification"
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: SPRING_FLYWAY_BASELINE_VERSION
              value: "0"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx256m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC"
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: sacco-core
  labels:
    app: notification-service
spec:
  type: LoadBalancer
  selector:
    app: notification-service
  ports:
    - name: http
      protocol: TCP
      port: 8086
      targetPort: 8086
    - name: grpc
      protocol: TCP
      port: 9086
      targetPort: 9086
