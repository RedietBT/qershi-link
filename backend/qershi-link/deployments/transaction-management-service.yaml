apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-management-service
  namespace: sacco-core
  labels:
    app: transaction-management-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-management-service
  template:
    metadata:
      labels:
        app: transaction-management-service
    spec:
      containers:
        - name: transaction-management-service
          image: transaction-management-service:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8083
            - name: grpc
              containerPort: 9083
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/qershi-link?stringtype=unspecified"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: SERVER_PORT
              value: "8083"
            - name: GRPC_SERVER_PORT
              value: "9083"
            - name: GRPC_CLIENT_ACCOUNT_SERVICE_ADDRESS
              value: "static://account-management-service:9082"
            - name: JWT_SECRET
              value: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-management-service
  namespace: sacco-core
  labels:
    app: transaction-management-service
spec:
  type: LoadBalancer
  selector:
    app: transaction-management-service
  ports:
    - name: http
      protocol: TCP
      port: 8083
      targetPort: 8083
    - name: grpc
      protocol: TCP
      port: 9083
      targetPort: 9083
