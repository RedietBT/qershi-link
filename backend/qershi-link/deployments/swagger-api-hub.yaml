apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-api-hub
  namespace: sacco-core
  labels:
    app: swagger-api-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swagger-api-hub
  template:
    metadata:
      labels:
        app: swagger-api-hub
    spec:
      containers:
        - name: swagger-api-hub
          image: swagger-api-hub:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 9020
          env:
            - name: SERVER_PORT
              value: "9020"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9020
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9020
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: swagger-api-hub
  namespace: sacco-core
  labels:
    app: swagger-api-hub
spec:
  selector:
    app: swagger-api-hub
  ports:
    - name: http
      protocol: TCP
      port: 9020
      targetPort: 9020
  type: ClusterIP
