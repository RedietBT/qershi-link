apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-api-hub
  namespace: sacco-core
  labels:
    app: swagger-api-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swagger-api-hub
  template:
    metadata:
      labels:
        app: swagger-api-hub
    spec:
      containers:
        - name: swagger-api-hub
          image: swagger-api-hub:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: SERVER_PORT
              value: "8090"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8090
            initialDelaySeconds: 300
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: swagger-api-hub
  namespace: sacco-core
  labels:
    app: swagger-api-hub
spec:
  type: LoadBalancer
  selector:
    app: swagger-api-hub
  ports:
    - name: http
      protocol: TCP
      port: 8090
      targetPort: 8090
