apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-management-service
  namespace: sacco-core
  labels:
    app: loan-management-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-management-service
  template:
    metadata:
      labels:
        app: loan-management-service
    spec:
      containers:
        - name: loan-management-service
          image: loan-management-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
              name: http
            - containerPort: 9085
              name: grpc
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/qershi-link?stringtype=unspecified"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: JWT_SECRET
              value: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
            - name: GRPC_CLIENT_NOTIFICATION_SERVICE_ADDRESS
              value: "static://notification-service:9086"
            - name: GRPC_CLIENT_ACCOUNT_SERVICE_ADDRESS
              value: "static://account-management-service:9082"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: loan-management-service
  namespace: sacco-core
spec:
  type: ClusterIP
  selector:
    app: loan-management-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
    - name: grpc
      port: 9085
      targetPort: 9085
