apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-management-service
  namespace: sacco-core
  labels:
    app: loan-management-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-management-service
  template:
    metadata:
      labels:
        app: loan-management-service
    spec:
      containers:
        - name: loan-management-service
          image: loan-management-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
            - containerPort: 9085
              name: grpc
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/qershi-link?stringtype=unspecified"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sacco-secrets
                  key: JWT_SECRET
            - name: GRPC_CLIENT_NOTIFICATION_SERVICE_ADDRESS
              value: "static://notification-service:9086"
            - name: GRPC_CLIENT_ACCOUNT_SERVICE_ADDRESS
              value: "static://account-management-service:9082"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-service"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_FLYWAY_TABLE
              value: "flyway_schema_history_loan_management"
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx256m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC"
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: loan-management-service
  namespace: sacco-core
spec:
  type: LoadBalancer
  selector:
    app: loan-management-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
    - name: grpc
      port: 9085
      targetPort: 9085
